name: CI

on:
  push:
    branches: [main, dev, "claude/**", "codex/**"]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint (changed files only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install ruff

      - name: Ruff format check (changed .py files only)
        run: |
          BASE=${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          bash scripts/check_changed_python.sh --base "$BASE" --format

      - name: Ruff lint (changed .py files only)
        if: always()
        run: |
          BASE=${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          bash scripts/check_changed_python.sh --base "$BASE" --lint

  typecheck:
    name: Type Check (changed files only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install mypy==1.20.0

      - name: Mypy (changed .py files only)
        run: |
          BASE=${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          bash scripts/check_changed_python.sh --base "$BASE" --typecheck

  fast-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install RECOVAR and test dependencies
        run: pip install -e '.[dev,gui]'

      - name: Run CPU unit tests with coverage
        env:
          CUDA_VISIBLE_DEVICES: ""
          JAX_PLATFORMS: cpu
          PYTHONNOUSERSITE: "1"
        run: |
          python -m pytest tests/unit/ -x \
            --cov=recovar --cov-report=term-missing:skip-covered --tb=short

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mkdocs
        run: pip install mkdocs-material mkdocstrings[python]

      - name: Build docs (strict)
        run: mkdocs build --strict
